# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json

pre-commit:
  parallel: true
  jobs:
    - name: secrets
      run: betterleaks git --pre-commit --staged --redact --verbose

    - name: biome
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    - name: whitespace
      run: git diff --cached --check

commit-msg:
  jobs:
    - name: conventional
      run: |
        head -1 {1} | grep -qE '^(feat|fix|refactor|docs|chore|test|style|ci)(\(.+\))?!?: .+' || { echo "Use Conventional Commits: type(scope): description"; exit 1; }
