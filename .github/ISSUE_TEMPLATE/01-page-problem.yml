name: Something is wrong on a page
description: A typo, a broken link, a wrong fact, or a page that renders or navigates badly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This site takes fixes, not features. If you are not sure whether something counts as a fix, ask here anyway.
  - type: input
    id: page
    attributes:
      label: Page URL
      description: The full address of the page where you saw it.
      placeholder: https://svyatov.com/blog/some-post/
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: Quote the text or describe what you see.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should say or do
      description: For a factual correction, link the source the right fact comes from.
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: Only needed for a layout or keyboard problem. The site is tested in Chromium only, so another browser is the first thing to check.
      placeholder: Firefox 143 on macOS 26
