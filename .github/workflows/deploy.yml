name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      full-audit:
        description: Three Lighthouse runs of every page instead of one run per page type
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full-audit && 180 || 30 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect a content-only change
        id: changes
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^ HEAD -- . ':!src/content/blog'; then echo content-only=true; else echo content-only=false; fi >> "$GITHUB_OUTPUT"
      - name: Lint, type-check, build, test
        uses: withastro/action@v6
        with:
          build-cmd: bun run verify
          package-manager: bun@1.4.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install fixed browser revision
        if: steps.changes.outputs.content-only != 'true'
        run: bunx --no-install playwright install --with-deps chromium
      - name: Browser behavior and accessibility checks
        if: steps.changes.outputs.content-only != 'true'
        run: bun run test:e2e
      - name: Lighthouse
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bun run ${{ inputs.full-audit && 'audit:full' || 'audit' }}
      - name: Preserve browser and audit reports
        if: always() && steps.changes.outputs.content-only != 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prepublication-reports
          path: |
            audit-results/
            playwright-report/
            test-results/
            .lighthouseci/
          include-hidden-files: true
          retention-days: 30

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
